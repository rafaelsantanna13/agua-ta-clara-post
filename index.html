<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Água Tá Clara — Postar</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:auto;padding:20px;background:#f6f2e8;color:#123f4d}
h1{margin-bottom:2px}.sub{margin-top:0;color:#587078}
.box{background:#fff;border-radius:16px;padding:14px;margin:15px 0;box-shadow:0 2px 10px #0001}
.box img{width:100%;display:block;border-radius:10px}
.btn,button{display:block;box-sizing:border-box;width:100%;padding:14px;margin-top:10px;border:0;border-radius:11px;background:#087f83;color:white;text-align:center;text-decoration:none;font-size:16px;font-weight:700}
.secondary{background:#174b59}.refresh{background:#56686d}
textarea{width:100%;box-sizing:border-box;min-height:180px;padding:10px;font-size:15px}
#status{font-weight:600}
</style>
</head>
<body>
<h1>ÁGUA TÁ CLARA</h1>
<p class="sub">Central de postagem</p>

<div class="box">
  <div id="status">Carregando última previsão…</div>
  <button class="refresh" onclick="location.href=location.pathname+'?v='+Date.now()">↻ RECARREGAR CARDS</button>
  <a class="btn secondary" href="https://github.com/rafaelsantanna13/agua-ta-clara/actions/workflows/daily-morning-nowcast.yml" target="_blank">☀ ATUALIZAR CONDIÇÕES DE HOJE</a>
  <a class="btn secondary" href="https://github.com/rafaelsantanna13/agua-ta-clara/actions/workflows/daily-tomorrow-forecast.yml" target="_blank">🌊 GERAR PREVISÃO DE AMANHÃ</a>
</div>

<div id="cards"></div>

<div class="box">
  <h2>Legenda</h2>
  <textarea id="caption" readonly></textarea>
  <button id="copy">COPIAR LEGENDA</button>
</div>

<div class="box">
  <h2 id="reelTitle">Reel · Zé Marola</h2>
  <video id="reelVideo" controls playsinline style="width:100%;border-radius:10px"></video>
  <a id="reelDownload" class="btn" href="reel.mp4" download="agua-ta-clara-reel.mp4">BAIXAR REEL</a>
</div>

<script>
const files=[['01_surf.png','SURF'],['02_natacao_mergulho.png','NATAÇÃO & MERGULHO'],['03_remo_ze_marola.png','REMO']];

(async()=>{
  try{
    const nonce=Date.now();
    const m=await (await fetch('run.json?'+nonce,{cache:'no-store'})).json();
    status.textContent='Última rodada: '+m.target_date+' · '+m.kind;
    // Manual Surfconnect corrections can regenerate media from the same scientific
    // morning run. Use the correction id as cache key so browsers/CDNs do not keep
    // serving the pre-correction PNG/MP4 under the unchanged baseline run_id.
    const assetVersion=(m.publication_view&&m.publication_view.correction_run_id)
      ? m.publication_view.correction_run_id
      : m.run_id;

    for(const [f,l] of files){
      const d=document.createElement('div');
      d.className='box';
      d.innerHTML='<h2>'+l+'</h2><img src="'+f+'?v='+encodeURIComponent(assetVersion)+'"><a class="btn" href="'+f+'?v='+encodeURIComponent(assetVersion)+'" download="'+f+'">BAIXAR '+l+'</a>';
      cards.appendChild(d);
    }

    caption.value=await (await fetch('caption.txt?v='+encodeURIComponent(assetVersion),{cache:'no-store'})).text();

    const s=await (await fetch('reel_script.json?v='+encodeURIComponent(assetVersion),{cache:'no-store'})).json();
    const reelUrl='reel.mp4?v='+encodeURIComponent(assetVersion);
    reelVideo.src=reelUrl;
    reelDownload.href=reelUrl;
    reelDownload.textContent='BAIXAR REEL '+s.duration_seconds+'s';
    reelTitle.textContent='Reel · Zé Marola · '+s.duration_seconds+'s';
  }catch(e){
    status.textContent='Aguardando a primeira previsão publicada.';
  }
})();

copy.onclick=async()=>{
  try{
    await navigator.clipboard.writeText(caption.value);
    copy.textContent='COPIADA ✓';
  }catch(e){
    caption.select();
    document.execCommand('copy');
  }
};
</script>
</body>
</html>
